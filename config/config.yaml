fastq_dir: /Users/2021nf001/git/workflow_snakemake/GeVarLi/resources/reads
modules:
  qualities: true
  keeptrim: false
  clipping: false
  covstats: true
  consensus: true
  lineages: true
  gisaid: false
tools:
  mapper: bwa
  caller: ivar
  assigner: nextclade
consensus:
  reference:
  - AF272001
  min_depth: '1'
  max_depth: '0'
  min_freq: 0.2
  min_indel: 0.8
  map_qual: --no-BAQ
  min_bq: '0'
  min_qual: '0'
gisaid:
  username: username
  threshold: '30'
  name: hCoV-19
  country: France
  identifier: ''
  year: '2025'
nextclade:
  path: resources/nextclade/
  dataset: sars-cov-2
primers:
  offset: '0'
  min_length: '35'
  min_qual: '20'
  slide: '4'
  bed:
    path: resources/primers_schemes/bed/
    scheme: nCoV-2019/V5.3.2/SARS-CoV-2.primer.bed
bwa:
  algorithm: ''
bowtie2:
  algorithm: ''
  sensitivity: --very-sensitive
minimap2:
  algorithm:
    k-mer_size: '21'
    minimizer_size: '11'
    split_size: 8G
    homopolymer: ''
  preset: sr
sickle_trim:
  quality: '30'
  length: '50'
  command: pe
  encoding: sanger
cutadapt:
  clipping: '0'
  length: '50'
  adapters:
  - AGATCGGAAGAGC
  - CTGTCTCTTATACACATC
  - TGGAATTCTCGGGTGCCAAGG
multiqc:
  path: config/multiqc/
  config: default.yaml
  tag: ''
fastq_screen:
  config: config/fastq-screen.conf
  subset: '100000'
rename:
  barcode_id: true
  line_id: true
  end_id: true
resources:
  cpus: '8'
  ram: '4'
  tmp_dir: $TMPDIR
envs:
  bcftools: ../envs/bcftools_v.1.22.yaml
  bedtools: ../envs/bedtools_v.2.31.1.yaml
  bowtie2: ../envs/bowtie2_v.2.5.4.yaml
  bwa: ../envs/bwa_v.0.7.19.yaml
  cutadapt: ../envs/cutadapt_v.5.2.yaml
  fastq_screen: ../envs/fastq-screen_v.0.16.yaml
  fastqc: ../envs/fastqc_v.0.12.1.yaml
  gawk: ../envs/gawk_v.5.3.1.yaml
  ivar: ../envs/ivar_v.1.4.4.yaml
  minimap2: ../envs/minimap2_v.2.30.yaml
  multiqc: ../envs/multiqc_v.1.21.yaml
  nextclade: ../envs/nextclade_v.3.18.1.yaml
  pangolin: ../envs/pangolin_v.4.3.3.yaml
  samtools: ../envs/samtools_v.1.22.1.yaml
  sickle_trim: ../envs/sickle-trim_v.1.33.yaml
  tsv2vcf: ../envs/tsv2vcf_v.2025.12.yaml
  workflow: ../envs/workflow-core.yaml
report:
  stat:
    extention:
    - txt
    - tsv
    - json
  graph:
    type:
    - dag
    - rulegraph
    - filegraph
    extention:
    - png
    - svg
    - pdf

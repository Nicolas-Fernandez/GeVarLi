stages:
  - test
  - deploy

image: python:3.12-slim

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

cache:
  key: $CI_COMMIT_REF_SLUG

# -----------------------------------------------------------------------------
# Pipeline Validation (Snakemake DAG & dry-run validation on test dataset)
# -----------------------------------------------------------------------------
test_pipeline:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y git
    - pip install snakemake pyyaml
  script:
    - snakemake --directory . --snakefile workflow/Snakefile --configfile config/config.yaml --config fastq_dir='.test/reads/' --dry-run
  rules:
    - if: $CI_COMMIT_BRANCH

# -----------------------------------------------------------------------------
# Documentation Build Validation (Strict mode for branch commits / MRs)
# -----------------------------------------------------------------------------
test_docs:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y git
    - pip install mkdocs-material pymdown-extensions mkdocs-minify-plugin mkdocs-macros-plugin mkdocs-embed-external-markdown mkdocs-include-markdown-plugin pyyaml
  script:
    - mkdocs build --strict --verbose --site-dir test
  artifacts:
    paths:
      - test
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# Documentation Deployment to GitLab Pages (on default branch 'main')
# -----------------------------------------------------------------------------
pages:
  stage: deploy
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y git
    - pip install mkdocs-material pymdown-extensions mkdocs-minify-plugin mkdocs-macros-plugin mkdocs-embed-external-markdown mkdocs-include-markdown-plugin pyyaml
  script:
    - mkdocs build --verbose --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
